name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config autoconf automake libtool cmake

      - name: Download llvm-mingw
        shell: bash
        run: |
          mkdir -p toolchains

          curl -L --fail --retry 3 \
            -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz

          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  /tmp/llvm-mingw.tar.xz" \
            | shasum -a 256 -c -

          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      - name: Verify VC runtime
        shell: bash
        run: |
          set -e

          test -d app/Madeira/x86_64-vcruntime

          for f in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            test -f "app/Madeira/x86_64-vcruntime/$f"
          done

      - name: Build GnuTLS
        run: build/gnutls-ios/build.sh

      - name: Build FFmpeg
        run: build/ffmpeg/build.sh

      - name: Build FEX iOS
        shell: bash
        run: |
          set -e

          cmake -S FEX -B FEX/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_OSX_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MACOSX_BUNDLE=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_THUNKS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DTUNE_CPU=generic \
            -DTUNE_ARCH=generic \
            -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON

          cmake --build FEX/build-ios \
            -j"$(sysctl -n hw.ncpu)" \
            --target FEXCore FEXCore_Base JemallocLibs \
                       cephes_128bit softfloat_3e fmt xxhash

      - name: Build FEX ARM64EC
        shell: bash
        run: |
          set -e
          build/fex-arm64ec/build.sh

      - name: Build Wine
        shell: bash
        run: |
          set -e
          build/ntdll-unix/build.sh
          build/wineserver/build.sh
          build/win32u-unix/build.sh
          build/wine-pe/build-ntdll.sh

      - name: Build DXMT iOS
        shell: bash
        run: |
          set -e
          build/dxmt-ios/build.sh

      - name: Build DXMT ARM64EC
        shell: bash
        run: |
          set -e

          meson setup dxmt/build-arm64ec dxmt \
            -Dbuildtype=release \
            -Dwine_build_path=../../wine/build-arm64ec \
            --cross-file=dxmt/build-arm64ec-win.txt

          ninja -C dxmt/build-arm64ec src/winemetal/winemetal.dll

      - name: Build pairing
        run: build/rppairing-ios/build.sh

      - name: Build D3D12
        run: build/madeira-d3d12/build-pe.sh

      - name: Stage licenses
        run: build/stage-licenses.sh

      - name: Build Madeira
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -e

          rm -rf Payload Madeira.ipa
          mkdir Payload

          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphoneos/Madeira.app' \
            -type d \
            -print -quit)

          test -n "$APP"

          cp -R "$APP" Payload/Madeira.app

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7
