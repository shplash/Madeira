name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config autoconf automake libtool cmake

      - name: Download llvm-mingw
        run: |
          mkdir -p toolchains
          curl -L --fail --retry 3 \
            -o /tmp/llvm-mingw.tar.xz \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz

          echo "bd85a3975723815cef28dbbd2ca2cb0c926f6b348a12a0453f39f7af273cb3f7  /tmp/llvm-mingw.tar.xz" | shasum -a 256 -c -

          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains

      - name: Verify VC runtime
        run: |
          test -d app/Madeira/x86_64-vcruntime

          for f in \
            concrt140.dll \
            msvcp140.dll \
            msvcp140_1.dll \
            msvcp140_2.dll \
            msvcp140_atomic_wait.dll \
            msvcp140_codecvt_ids.dll \
            vcamp140.dll \
            vccorlib140.dll \
            vcomp140.dll \
            vcruntime140.dll \
            vcruntime140_1.dll \
            vcruntime140_threads.dll
          do
            test -f "app/Madeira/x86_64-vcruntime/$f"
          done

      - name: Build GnuTLS
        run: build/gnutls-ios/build.sh

      - name: Build FFmpeg
        run: build/ffmpeg/build.sh

      - name: Build FEX
        run: |
          build/fex-ios/build.sh
          build/fex-arm64ec/build.sh

      - name: Build Wine
        run: |
          build/ntdll-unix/build.sh
          build/wineserver/build.sh
          build/win32u-unix/build.sh
          build/wine-pe/build-ntdll.sh

      - name: Build DXMT
        run: |
          build/dxmt-ios/build.sh

          meson setup dxmt/build-arm64ec dxmt \
            -Dbuildtype=release \
            -Dwine_build_path=../../wine/build-arm64ec \
            --cross-file=dxmt/build-arm64ec-win.txt

          ninja -C dxmt/build-arm64ec src/winemetal/winemetal.dll

      - name: Build pairing
        run: build/rppairing-ios/build.sh

      - name: Build D3D12
        run: build/madeira-d3d12/build-pe.sh

      - name: Stage licenses
        run: build/stage-licenses.sh

      - name: Build Madeira
        run: |
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            build

      - name: Package IPA
        run: |
          rm -rf Payload Madeira.ipa
          mkdir Payload

          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphoneos/Madeira.app' \
            -type d \
            -print -quit)

          test -n "$APP"

          cp -R "$APP" Payload/Madeira.app
          ditto -c -k --sequesterRsrc --keepParent Payload Madeira.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7
